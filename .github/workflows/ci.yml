name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: 06a466935536f8c9bcacb2d5efc0fc021be1bdff
          path: pi-upstream
          persist-credentials: false

      - run: npm ci
      - name: Install fixed Pi workspace dependencies
        working-directory: pi-upstream
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the versioned native MCP patch
        run: |
          git -C pi-upstream apply --check "$GITHUB_WORKSPACE/patches/pi-1.2.0-native-mcp-management.patch"
          git -C pi-upstream apply "$GITHUB_WORKSPACE/patches/pi-1.2.0-native-mcp-management.patch"
      - name: Test patched Pi native MCP owner
        working-directory: pi-upstream/packages/coding-agent
        run: |
          node "$(git rev-parse --show-toplevel)/node_modules/vitest/dist/cli.js" --run \
            test/mcp-management.test.ts \
            test/mcp-extension.test.ts \
            test/mcp-direct-tools-config.test.ts \
            test/mcp-owner-assembly.test.ts
      - name: Build and test adapter public artifacts against patched Pi
        run: npm run test:public-types -- --pi-source "$GITHUB_WORKSPACE/pi-upstream"
      - name: Verify committed dist matches source
        run: |
          if ! git diff --exit-code -- dist; then
            echo '::error::Committed dist/ is stale. Run test:public-types with a fixed patched Pi checkout and commit the regenerated artifacts.'
            exit 1
          fi
      - name: Test patched Pi and adapter in one session
        run: npm run test:patched-native-session -- --pi-source "$GITHUB_WORKSPACE/pi-upstream"
      - name: Test managed Pi update hook
        run: npm run test:managed-pi-update-hook
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - run: npm run test:vitest
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --ignore-scripts --dry-run

  production-install:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the committed production artifact
        shell: pwsh
        run: |
          $tarball = npm pack --ignore-scripts --pack-destination $env:RUNNER_TEMP --silent
          "TARBALL=$tarball" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install production dependencies like Pi Git packages
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          Push-Location $consumer
          npm init -y --silent | Out-Null
          npm install --omit=dev --no-audit --no-fund (Join-Path $env:RUNNER_TEMP $env:TARBALL) --silent
          Pop-Location
      - name: Load public exports without devDependencies
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          Push-Location $consumer
          node --input-type=module --eval "for (const name of ['config', 'metadata-cache', 'types', 'oauth']) await import('pi-mcp-adapter/' + name)"
          Pop-Location
      - name: Smoke test the published CLI bundle
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          node (Join-Path $consumer "node_modules/pi-mcp-adapter/dist/cli.js") --help

  node24-worker-fds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --run test/integration/tools/mcp-code.test.ts
