name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Verify committed public build
        run: |
          npm run build:public
          git diff --exit-code -- dist
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - name: Typecheck
        run: npm run typecheck
      - run: npm run test:public-exports
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run

  production-install:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the committed production artifact
        shell: pwsh
        run: |
          $tarball = npm pack --ignore-scripts --pack-destination $env:RUNNER_TEMP --silent
          "TARBALL=$tarball" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install production dependencies like Pi Git packages
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          Push-Location $consumer
          npm init -y --silent | Out-Null
          npm install --omit=dev --no-audit --no-fund (Join-Path $env:RUNNER_TEMP $env:TARBALL) --silent
          Pop-Location
      - name: Load public exports without devDependencies
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          Push-Location $consumer
          node --input-type=module --eval "for (const name of ['config', 'metadata-cache', 'types', 'oauth']) await import('pi-mcp-adapter/' + name)"
          Pop-Location
      - name: Smoke test the published CLI bundle
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "pi-mcp-production-consumer"
          node (Join-Path $consumer "node_modules/pi-mcp-adapter/dist/cli.js") --help

  node24-worker-fds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --run test/integration/tools/mcp-code.test.ts
